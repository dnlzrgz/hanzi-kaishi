[package]
name = "hanzi-kaishi"
version = "0.1.3"
edition = "2024"
authors = ["dnlzrgz <contact@dnlzrgz.com>"]
description = "A CLI for building custom Chinese Anki decks from vocabulary, sentences, and audio scraped from the web."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnlzrgz/hanzi-kaishi"
keywords = ["anki", "chinese", "flashcards", "cli", "scraper"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
scraper = "0.27.0"
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["stream", "blocking", "brotli"] }
url = "2.5.8"
genanki-rs = "0.4.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
